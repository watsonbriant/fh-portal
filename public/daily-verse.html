<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verse of the Day</title>
  <link rel="preconnect" href="https://dailyverses.net" crossorigin>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px 12px;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      color: #52525b;
      background: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: #a1a1aa;
        background: #27272a;
      }
    }

    #dailyVersesWrapper {
      margin: 0;
    }

    .dailyVerses.bibleVerse {
      margin-top: 0;
      padding: 0;
      font-size: 13px;
      line-height: 1.6;
      color: #52525b;
    }

    @media (prefers-color-scheme: dark) {
      .dailyVerses.bibleVerse {
        color: #a1a1aa;
      }
    }

    .dailyVerses.bibleVerse a {
      font-weight: 600;
      color: #18181b;
      text-decoration: none;
    }

    .dailyVerses.bibleVerse a:hover {
      text-decoration: underline;
    }

    @media (prefers-color-scheme: dark) {
      .dailyVerses.bibleVerse a {
        color: #fafafa;
      }
    }

    .dailyVerses .bibleVerse {
      font-style: italic;
      margin-bottom: 0.25em;
    }

    .dailyVerses .bibleRef {
      font-size: 12px;
      font-weight: 500;
      color: #71717a;
    }

    @media (prefers-color-scheme: dark) {
      .dailyVerses .bibleRef {
        color: #a1a1aa;
      }
    }
  </style>
</head>

<body>
  <div id="dailyVersesWrapper"></div>
  <script async defer src="https://dailyverses.net/get/verse.js?language=niv"></script>
  <script>
    (function() {
      function reportHeight() {
        var height = document.body.scrollHeight;
        if (window.parent !== window) {
          window.parent.postMessage({ type: 'dailyVerseResize', height: height }, '*');
        }
      }
      var wrapper = document.getElementById('dailyVersesWrapper');
      if (wrapper) {
        var observer = new MutationObserver(function() {
          reportHeight();
        });
        observer.observe(wrapper, { childList: true, subtree: true });
      }
      window.addEventListener('load', reportHeight);
      setTimeout(reportHeight, 500);
      setTimeout(reportHeight, 1500);
    })();
  </script>
</body>

</html>
